<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Antes de comprar — Tu decisión empieza con claridad</title>
    <meta
      name="description"
      content="Nueve micropreguntas para reconocer lo que sabes y lo que necesitas aclarar antes de comprar un inmueble."
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap");
      :root {
        --ink: #152f3e;
        --accent: #007f93;
        --accent-soft: #dceff2;
        --paper: #ffffff;
        --muted: #566772;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px "DM Sans",
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      header {
        height: 100px;
        max-width: 1320px;
        margin: auto;
        padding: 0 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dce3e7;
      }
      .brand {
        font:
          800 21px Manrope,
          sans-serif;
        letter-spacing: -1px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mark {
        width: 30px;
        height: 30px;
        border: 2px solid var(--accent);
        transform: rotate(-8deg);
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 19px;
      }
      .tag {
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--muted);
      }
      main {
        max-width: 1320px;
        margin: auto;
        padding: 58px 48px 40px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--accent);
      }
      h1 {
        font:
          500 clamp(42px, 5.5vw, 76px) / 1.08 Manrope,
          sans-serif;
        letter-spacing: -3.5px;
        margin: 22px 0;
      }
      h1 em {
        font-style: normal;
        color: #008da5;
      }
      p {
        line-height: 1.7;
        color: var(--muted);
      }
      .intro {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 70px;
        align-items: center;
      }
      .intro p {
        max-width: 465px;
        font-size: 17px;
      }
      .primary {
        background: var(--ink);
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 18px 25px;
        display: inline-flex;
        gap: 40px;
        align-items: center;
        font-weight: 600;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .sub {
        font-size: 12px;
        margin-top: 16px;
        color: var(--muted);
      }
      .scene {
        height: 420px;
        position: relative;
        background: #e8f2f5;
        border-radius: 180px 180px 16px 16px;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .house {
        width: 235px;
        height: 240px;
        background: #f1f5f7;
        position: relative;
        box-shadow: 25px 15px 0 #b9cdd6;
        margin-bottom: 0;
      }
      .house:before {
        content: "";
        position: absolute;
        width: 180px;
        height: 80px;
        top: -80px;
        left: 0;
        background: #152f3e;
        clip-path: polygon(0 100%, 100% 0, 100% 100%);
      }
      .house:after {
        content: "";
        position: absolute;
        left: 32px;
        bottom: 0;
        width: 70px;
        height: 130px;
        background: #008da5;
        box-shadow: 105px -50px 0 -14px #8aabb9;
      }
      .sun {
        position: absolute;
        top: 48px;
        right: 65px;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: #c9e9ee;
      }
      .tree {
        position: absolute;
        left: 22px;
        bottom: 0;
        width: 70px;
        height: 160px;
        background: #5a8c9c;
        border-radius: 70px 70px 0 0;
      }
      .floating {
        position: absolute;
        right: 18px;
        bottom: 25px;
        background: #ffffff;
        padding: 18px 22px;
        border-radius: 12px;
        font-size: 13px;
        box-shadow: 0 12px 40px #152f3e10;
        z-index: 1;
      }
      .floating b {
        display: block;
        font-size: 18px;
        margin-bottom: 6px;
      }
      .steps {
        margin-top: 60px;
        border-top: 1px solid #dce3e7;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding-top: 28px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .circle {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border: 1px solid #b5c7cf;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
      }
      .step b {
        font-size: 14px;
      }
      .step small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 5px;
      }
      .done .circle {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .needs-review .circle,
      .complete .bigcheck.needs-review {
        background: #806000;
        color: #fff3a6;
        border-color: #806000;
      }
      .needs-review small { color: #8a6500; }
      .review-flag { color: #8a6500; font-weight: 600; }
      .active .circle {
        background: var(--accent-soft);
        border-color: var(--accent-soft);
      }
      footer {
        max-width: 1224px;
        margin: 30px auto;
        padding: 20px 0;
        border-top: 1px solid #dce3e7;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        gap: 20px;
      }
      footer span {
        max-width: 700px;
        line-height: 1.6;
      }
      .quiz {
        max-width: 850px;
        margin: 0 auto;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .progress {
        height: 4px;
        background: #e0e9ed;
        margin: 20px 0 46px;
        border-radius: 5px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.4s;
      }
      h2 {
        font:
          500 clamp(28px, 3.5vw, 43px) / 1.2 Manrope,
          sans-serif;
        letter-spacing: -1.4px;
        margin: 18px 0;
      }
      .hint {
        font-size: 15px;
        max-width: 630px;
        min-height: 52px;
      }
      .scale {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        margin: 35px 0 10px;
      }
      .rating {
        height: 76px;
        background: transparent;
        border: 1px solid #b9c9d1;
        border-radius: 10px;
        font:
          500 27px Manrope,
          sans-serif;
        color: var(--ink);
      }
      .rating:hover {
        background: #edf6f8;
      }
      .rating[aria-pressed="true"] {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .actions {
        margin-top: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .back {
        background: none;
        border: 0;
        color: var(--muted);
        padding: 15px 0;
      }
      .notice {
        background: #edf5f7;
        border-radius: 12px;
        padding: 16px 20px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
      .result {
        max-width: 850px;
        margin: auto;
      }
      .result h1 {
        font-size: 49px;
        letter-spacing: -2px;
      }
      .pill {
        display: inline-block;
        padding: 8px 12px;
        background: var(--accent-soft);
        border-radius: 30px;
        font-size: 12px;
        font-weight: 600;
      }
      .review {
        margin: 28px 0;
      }
      .review article {
        padding: 20px 0;
        border-bottom: 1px solid #dce3e7;
        display: flex;
        gap: 18px;
      }
      .review article b {
        display: block;
        margin-bottom: 6px;
      }
      .review article p {
        font-size: 14px;
        margin: 0;
      }
      .badge {
        font-size: 12px;
        white-space: nowrap;
        color: var(--accent);
        padding-top: 3px;
      }
      button:focus-visible {
        outline: 3px solid #008da5;
        outline-offset: 4px;
      }
      .complete {
        text-align: center;
        max-width: 650px;
        margin: 45px auto;
      }
      .complete .bigcheck {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--accent-soft);
        display: grid;
        place-items: center;
        font-size: 38px;
        margin: 0 auto 25px;
      }
      .checklist-title {
        margin: 40px 0 0;
        font-size: 15px;
        font-weight: 600;
      }
      .steps {
        margin-top: 18px;
      }
      .step {
        align-items: flex-start;
      }
      .step b {
        line-height: 1.6;
      }
      .review h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .review ul {
        padding-left: 20px;
        color: var(--muted);
        line-height: 1.8;
        font-size: 14px;
      }
      .reflection {
        background: #edf5f7;
        border-radius: 8px;
        padding: 15px;
        margin-top: 18px !important;
      }
      .reflection b {
        color: var(--ink);
      }
      @media (max-width: 720px) {
        header {
          height: 80px;
          padding: 0 22px;
        }
        .tag {
          display: none;
        }
        main {
          padding: 36px 22px;
        }
        .intro {
          grid-template-columns: 1fr;
          gap: 35px;
        }
        h1 {
          letter-spacing: -2px;
        }
        .scene {
          height: 280px;
          border-radius: 130px 130px 14px 14px;
        }
        .house {
          height: 150px;
          width: 190px;
        }
        .house:after {
          height: 100px;
        }
        .steps {
          gap: 18px;
          margin-top: 35px;
          grid-template-columns: 1fr;
        }
        .step small {
          display: inline;
          margin-left: 8px;
        }
        .scale {
          gap: 7px;
        }
        .rating {
          height: 60px;
        }
        .progress {
          margin-bottom: 30px;
        }
        footer {
          margin: 10px 22px;
          flex-direction: column;
        }
        .result h1 {
          font-size: 38px;
        }
        .review article {
          gap: 10px;
        }
        .badge {
          white-space: normal;
          min-width: 67px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">⌂</span>
        Antes de comprar
        <span style="color: #008da5">.</span>
      </div>
      <span class="tag">Una decisión más consciente</span>
    </header>
    <main id="app"></main>
    <footer>
      <span>
        Prototipo educativo · Tus respuestas expresan tu percepción. Esta guía
        no verifica documentos ni determina la conveniencia legal o financiera
        de una compra.
      </span>
      <span>9 micropreguntas. Un siguiente paso más claro.</span>
    </footer>
    <script>
      const groups = [
        {
          title: "¿Entiendo lo que voy a comprar?",
          short: "Conoce el inmueble",
          questions: [
            [
              "Tengo claro qué incluye el inmueble.",
              "Piensa en sus características, espacios y lo que recibirías al comprar.",
              "Pide una descripción por escrito de lo que incluye y excluye la compra.",
            ],
            [
              "Sé qué servicios están disponibles hoy.",
              "Distingue lo que ya existe de lo que todavía se ofrece como promesa.",
              "Confirma qué servicios funcionan hoy y cuáles siguen pendientes.",
            ],
            [
              "Sé si el inmueble responde a mis necesidades.",
              "Considera el uso que le darías, su ubicación y tus prioridades.",
              "Compara el inmueble con tus necesidades y prioridades reales.",
            ],
          ],
        },
        {
          title: "¿Tengo información para respaldar mi decisión?",
          short: "Confirma la información",
          questions: [
            [
              "Sé qué documentos respaldan la propiedad.",
              "Considera si puedes identificar los documentos y quién puede revisarlos.",
              "Solicita la documentación de propiedad y su revisión profesional.",
            ],
            [
              "Distingo lo confirmado de lo prometido.",
              "Piensa en las fechas, características y compromisos que te han comunicado.",
              "Pide que cada promesa relevante tenga un respaldo por escrito.",
            ],
            [
              "Tengo claro el costo total de la compra.",
              "Incluye los gastos adicionales al precio anunciado y los compromisos de pago.",
              "Solicita un desglose completo de precio, gastos y pagos.",
            ],
          ],
        },
        {
          title: "¿Sé qué necesito aclarar antes de decidir?",
          short: "Prepara tu siguiente paso",
          questions: [
            [
              "Sé qué dudas me falta resolver.",
              "Piensa si puedes nombrar la información que todavía necesitas.",
              "Escribe tus dudas y ordénalas por importancia.",
            ],
            [
              "Sé quién debe responder cada duda.",
              "Identifica a la persona o profesional que puede confirmar cada dato.",
              "Asigna a cada duda una persona que pueda responderla con evidencia.",
            ],
            [
              "Tengo claro qué necesito confirmar antes de comprometerme.",
              "Piensa en las condiciones que deben cumplirse antes de firmar o entregar dinero.",
              "Define qué necesitas comprobar antes de asumir un compromiso.",
            ],
          ],
        },
      ];
      let answers = Array(9).fill(null),
        index = 0,
        screen = "intro";
      const app = document.querySelector("#app");
      const completedGroups = new Set();
      // Regla orientativa del prototipo: dos preguntas de mayor peso y una de apoyo.
      const questionWeights = [0.4, 0.4, 0.2];
      const passingScore = 3.2;
      function groupPasses(groupIndex) {
        const scores = answers.slice(groupIndex * 3, groupIndex * 3 + 3);
        return scores.every(value => value !== null) &&
          scores.reduce((total, value, j) => total + value * questionWeights[j], 0)
            >= passingScore - 1e-9;
      }
      function checklist() {
        const current = screen === "question" ? Math.floor(index / 3) : -1;
        return `
          <section aria-label="Checklist de preguntas principales">
            <h3 class="checklist-title">Tus tres preguntas principales</h3>
            <div class="steps">
              ${groups
                .map((group, i) => {
                  const done = completedGroups.has(i);
                  const review = done && !groupPasses(i);
                  const active = !done && current === i;
                  const count = answers
                    .slice(i * 3, i * 3 + 3)
                    .filter((value) => value !== null).length;
                  return `
                  <div class="step ${review ? "needs-review" : done ? "done" : active ? "active" : ""}">
                    <span class="circle" aria-hidden="true">${review ? "−" : done ? "✓" : i + 1}</span>
                    <div>
                      <b>${group.title}</b>
                      <small>${review ? "Conviene revisar · 3 de 3" : done ? "Completada · 3 de 3" : count ? `${count} de 3 respondidas` : "Por explorar"}</small>
                    </div>
                  </div>`;
                })
                .join("")}
            </div>
          </section>`;
      }
      function feedback() {
        return groups
          .map((group, i) => {
            const scores = answers.slice(i * 3, i * 3 + 3);
            const passed = groupPasses(i);
            const pending = group.questions.filter(
              (question, j) => scores[j] < 4,
            );
            const reflections = [
              "¿Qué característica del inmueble es indispensable para ti y cómo sabes que está incluida?",
              "¿Qué parte de tu confianza se apoya en información que puedes comprobar?",
              "¿Qué duda resolverías primero para sentir mayor claridad al decidir?",
            ];
            return `
            <article>
              <span class="badge ${!passed ? "review-flag" : ""}">${passed ? "✓ Criterio alcanzado" : "− Conviene revisar"}</span>
              <div>
                <h3>${group.title}</h3>
                <p>${
                  pending.length
                    ? ` ${passed ? "Alcanzaste el criterio ponderado del grupo. Aun así," : "Antes de avanzar,"} conviene revisar ${pending.length} aspecto${pending.length === 1 ? "" : "s"} donde expresaste menor seguridad:`
                    : "Expresaste confianza en las tres respuestas de este tema. Piensa qué información concreta respalda esa seguridad."
                }</p>
                ${pending.length ? `<ul>${pending.map((question) => `<li>${question[2]}</li>`).join("")}</ul>` : ""}
                <p class="reflection"><b>Para reflexionar</b>${reflections[i]}</p>
              </div>
            </article>`;
          })
          .join("");
      }
      function render() {
        if (screen === "intro") {
          app.innerHTML = `<section class="intro"><div><span class="eyebrow">Tu patrimonio empieza con una buena pregunta</span><h1>Antes de comprar,<br><em>date claridad.</em></h1><p>Comprar un inmueble es una gran decisión. Descubre qué tienes claro y qué necesitas preguntar antes de dar el siguiente paso.</p><button class="primary" id="start">Comenzar mi recorrido <span>↗</span></button><div class="sub">3 temas · 9 micropreguntas · A tu ritmo</div></div><div class="scene" role="img" aria-label="Ilustración de una casa en tonos azul marino y turquesa"><div class="sun"></div><div class="tree"></div><div class="house"></div><div class="floating"><b>La claridad también se construye.</b>Una pregunta a la vez.</div></div></section>${checklist(-1)}`;
          document.querySelector("#start").onclick = () => {
            screen = "question";
            render();
          };
          return;
        }
        if (screen === "question") {
          const g = Math.floor(index / 3),
            q = groups[g].questions[index % 3];
          app.innerHTML = `<section class="quiz"><div class="topline"><span class="eyebrow">${groups[g].short}</span><span class="sub">${index + 1} de 9</span></div><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${index}"><i style="width:${(index / 9) * 100}%"></i></div><span class="eyebrow">Tema ${g + 1} / 3 · Micropregunta ${(index % 3) + 1}</span><h2>${q[0]}</h2><p class="hint">${q[1]}</p><div class="scale" role="group" aria-label="¿Qué tan de acuerdo estás?">${Array.from({ length: 6 }, (_, n) => `<button class="rating" data-n="${n}" aria-pressed="${answers[index] === n}" aria-label="${n}: ${["Muy en desacuerdo", "En desacuerdo", "Algo en desacuerdo", "Algo de acuerdo", "De acuerdo", "Muy de acuerdo"][n]}">${n}</button>`).join("")}</div><div class="labels"><span>0 · Muy en desacuerdo</span><span>5 · Muy de acuerdo</span></div><div class="actions"><button class="back" id="back">← Anterior</button><button class="primary" id="next" ${answers[index] === null ? "disabled" : ""}>${index % 3 === 2 ? "Completar tema" : "Continuar"} <span>→</span></button></div>${checklist(g)}</section>`;
          document.querySelectorAll("[data-n]").forEach(
            (b) =>
              (b.onclick = () => {
                answers[index] = Number(b.dataset.n);
                render();
              }),
          );
          document.querySelector("#back").onclick = () => {
            if (index > 0) index--;
            else screen = "intro";
            render();
          };
          document.querySelector("#next").onclick = () => {
            if (index % 3 === 2) {
              completedGroups.add(Math.floor(index / 3));
              screen = "complete";
            } else index++;
            render();
            window.scrollTo(0, 0);
          };
          return;
        }
        if (screen === "complete") {
          const g = Math.floor(index / 3);
          const review = !groupPasses(g);
          app.innerHTML = `<section class="complete"><div class="bigcheck ${review ? "needs-review" : ""}" aria-hidden="true">${review ? "−" : "✓"}</div><span class="eyebrow">Tema ${g + 1} completado</span><h2>${groups[g].title}</h2><p>${review ? "El resultado ponderado indica que conviene revisar este tema. Al final verás los aspectos concretos por aclarar." : "Alcanzaste el criterio ponderado de este tema. El checkmark puede coexistir con dudas puntuales: al final verás cuáles conviene revisar."}</p><button class="primary" id="continue">${g === 2 ? "Ver mi resultado" : "Pasar al siguiente tema"} <span>→</span></button></section>${checklist(g + 1)}`;
          document.querySelector("#continue").onclick = () => {
            if (index === 8) screen = "result";
            else {
              index++;
              screen = "question";
            }
            render();
            window.scrollTo(0, 0);
          };
          return;
        }
        const ready = groups.every((group, i) => groupPasses(i)),
          pending = answers.filter((x) => x < 4).length;
        app.innerHTML = `<section class="result"><span class="pill">Tu punto de partida</span><h1>${ready ? "Te percibes preparado para dar el siguiente paso." : "Aún necesitas aclarar información antes de decidir."}</h1><p>${ready ? "Alcanzaste el criterio ponderado en los tres temas. Revisa las dudas puntuales señaladas y contrasta tu confianza con documentos y una revisión profesional." : "Identificaste " + pending + " aspecto" + (pending === 1 ? "" : "s") + " que conviene revisar. Usa esta lista para avanzar con preguntas concretas."}</p><div class="notice"><b>¿Cómo interpretar tu resultado?</b><br>En cada grupo, las dos primeras micropreguntas pesan 40 % cada una y la tercera 20 %. El checkmark requiere un promedio ponderado de al menos 3.2 sobre 5. Una respuesta menor a 4 sigue apareciendo como pendiente, aunque el grupo alcance ese criterio. Este criterio es orientativo y no ha sido validado. Una autoevaluación no puede determinar por sí sola si eres capaz de comprar o si un inmueble es una buena inversión.</div>${checklist()}<h2>Reflexiones y retroalimentación</h2><p>No necesitas resolver todo hoy. Elige un pendiente, busca una respuesta verificable y vuelve a revisar cómo te sientes al decidir.</p><div class="review">${feedback()}</div><div class="actions"><button class="back" id="edit">← Revisar mis respuestas</button><button class="primary" id="restart">Volver a empezar <span>↻</span></button></div></section>`;
        document.querySelector("#edit").onclick = () => {
          index = 0;
          screen = "question";
          render();
        };
        document.querySelector("#restart").onclick = () => {
          answers = Array(9).fill(null);
          completedGroups.clear();
          index = 0;
          screen = "intro";
          render();
        };
      }
      render();
    </script>
  </body>
</html>
